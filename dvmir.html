<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVMIR - Official Website</title>
    <!-- FontAwesome za ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #06080d;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animirana pozadina sa česticama */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambijentalni Glow u pozadini */
        .ambient-glow {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.07) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 38%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Glavni raspored */
        .main-layout {
            position: relative;
            z-index: 1;
            display: flex;
            width: 92%;
            max-width: 1180px;
            height: 82vh;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
        }

        /* CENTRALNA SEKCIJA */
        .center-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Profilna slika i Live status kontejner */
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            z-index: 2;
            background-color: #0f172a;
        }

        /* Klasa koja se pali kada si LIVE na YouTube-u */
        .profile-img.is-live {
            border-color: #ff0000;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.55);
        }

        /* Notifikacija / Bedž za LIVE status */
        .live-badge {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 20, 26, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #8b949e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            white-space: nowrap;
            z-index: 3;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #6e7681;
        }

        /* Izgled bedža kada SI LAJV */
        .live-badge.active {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-color: rgba(255, 120, 120, 0.5);
            color: #ffffff;
            box-shadow: 0 0 22px rgba(255, 0, 0, 0.65);
            cursor: pointer;
            animation: livePulse 2s infinite;
        }

        .live-badge.active .status-dot {
            background-color: #ffffff;
            box-shadow: 0 0 8px #ffffff;
            animation: blink 1s infinite;
        }

        .live-badge.active:hover {
            transform: translateX(-50%) scale(1.06);
        }

        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
            50% { box-shadow: 0 0 28px rgba(255, 0, 0, 0.9); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Ime i Opis */
        .title {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 4px;
            margin-bottom: 4px;
            background: linear-gradient(180deg, #ffffff 0%, #b0b8c4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
        }

        .subtitle {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        .subtitle a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .subtitle a:hover {
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.7);
            color: #ffffff;
        }

        /* Kocke za društvene mreže */
        .socials-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Glass & Shine efekat na kockama */
        .social-cube {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-cube span {
            font-size: 10px;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.65;
            letter-spacing: 0.3px;
            transition: opacity 0.3s;
        }

        /* Shine odsjaj pri prelasku mišem */
        .social-cube::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            transition: left 0.5s ease;
        }

        .social-cube:hover::before {
            left: 130%;
        }

        .social-cube:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .social-cube:hover span {
            opacity: 1;
        }

        /* Glow efekti u boji mreže */
        .social-cube.youtube:hover { box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.3); color: #ff0000; }
        .social-cube.kick:hover { box-shadow: 0 10px 25px rgba(83, 252, 24, 0.25), inset 0 1px 1px rgba(255,255,255,0.3); color: #53fc18; }
        .social-cube.tiktok:hover { box-shadow: 0 10px 25px rgba(0, 242, 254, 0.25), inset 0 1px 1px rgba(255,255,255,0.3); color: #00f2fe; }
        .social-cube.discord:hover { box-shadow: 0 10px 25px rgba(88, 101, 242, 0.3), inset 0 1px 1px rgba(255,255,255,0.3); color: #5865F2; }
        .social-cube.instagram:hover { box-shadow: 0 10px 25px rgba(225, 48, 108, 0.3), inset 0 1px 1px rgba(255,255,255,0.3); color: #E1306C; }
        .social-cube.linktree:hover { box-shadow: 0 10px 25px rgba(67, 230, 96, 0.25), inset 0 1px 1px rgba(255,255,255,0.3); color: #43E660; }

        /* DESNI PANEL (Zadnje Donacije) */
        .donations-sidebar {
            width: 350px;
            height: 440px;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-title i {
            color: #00d2ff;
        }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responzivnost za telefone */
        @media (max-width: 900px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
                padding: 30px 0;
            }
            .main-layout {
                flex-direction: column;
                height: auto;
                gap: 40px;
            }
            .donations-sidebar {
                width: 100%;
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- Animirane sitne čestice u pozadini -->

    <script>
        // --- 1. ANIMACIJA SITNIH ČESTICA (PARTICLES) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.25;
                this.opacity = Math.random() * 0.45 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(180, 220, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 85; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 2. AUTOMATSKA PROVJERA DA LI SI LAJV NA YOUTUBE-U ---
        const YT_CHANNEL_ID = 'UCzWuXxe1Zuiqc4xmkosvkoA';
        const badge = document.getElementById('live-status-badge');
        const badgeText = document.getElementById('live-status-text');
        const avatar = document.getElementById('profile-avatar');

        function setLiveUI(isLive) {
            if (isLive) {
                badge.classList.add('active');
                badgeText.innerText = 'LIVE NA YOUTUBE';
                avatar.classList.add('is-live');
            } else {
                badge.classList.remove('active');
                badgeText.innerText = 'OFFLINE';
                avatar.classList.remove('is-live');
            }
        }

        async function checkYouTubeLive() {
            try {
                const targetUrl = `https://www.youtube.com/channel/${YT_CHANNEL_ID}/live`;
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                
                if (data.contents && data.contents.includes('"isLive":true')) {
                    setLiveUI(true);
                } else {
                    setLiveUI(false);
                }
            } catch (err) {
                console.log('Provjera YouTube statusa nije uspjela:', err);
            }
        }

        // Inicijalna provjera i loop svakih 60 sekundi
        checkYouTubeLive();
        setInterval(checkYouTubeLive, 60000);

        // Dvoklik na profilnu sliku za brzi test interfejsa!
        avatar.addEventListener('dblclick', () => {
            const currentlyActive = badge.classList.contains('active');
            setLiveUI(!currentlyActive);
        });
    </script>
